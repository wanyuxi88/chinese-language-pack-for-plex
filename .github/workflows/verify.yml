name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 校验语言文件 (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 在 ubuntu-24.04 上没有现成构建，单独用 22.04 跑，保证老系统也能用
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 脚本可编译（不依赖第三方库）
        run: python -m compileall -q tools

      - name: 结构校验（占位符 / 空译文 / 首尾空白 / po-mo 同步 / 术语 / 跨端）
        run: python tools/check.py -v

      - name: 术语巡检
        run: python tools/gloss.py

      - name: README 进度表与 tools/progress.json 一致
        run: python tools/progress.py --check
